<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Magno Space: painel pessoal para disciplina, treino, notas e progresso diário." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./src/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./src/assets/icon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>Magno Space</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="brand-bar">
        <!-- Para trocar a logo, substitua o arquivo src/assets/logo.svg (ou aponte para um PNG). -->
        <img class="brand-logo" src="./src/assets/logo.svg" alt="" width="44" height="44" />
        <div class="brand-text">
          <h1 class="brand-name">MAGNO<span>SPACE</span></h1>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Seções do app">
        <button class="tab" role="tab" id="tab-today" aria-controls="page-today" data-tab="0">Hoje</button>
        <button class="tab" role="tab" id="tab-workouts" aria-controls="page-workouts" data-tab="1">Treinos</button>
        <button class="tab" role="tab" id="tab-notes" aria-controls="page-notes" data-tab="2">Notas</button>
        <button class="tab" role="tab" id="tab-calendar" aria-controls="page-calendar" data-tab="3">Calendário</button>
        <button class="tab" role="tab" id="tab-settings" aria-controls="page-settings" data-tab="4">Ajustes</button>
        <span class="tab-indicator" aria-hidden="true"></span>
      </nav>

      <main class="pager" id="pager">
        <section class="page" id="page-today" role="tabpanel" aria-labelledby="tab-today" data-page="today">
          <p class="boot">Carregando seu espaço de progresso…</p>
        </section>
        <section class="page" id="page-workouts" role="tabpanel" aria-labelledby="tab-workouts" data-page="workouts"></section>
        <section class="page" id="page-notes" role="tabpanel" aria-labelledby="tab-notes" data-page="notes"></section>
        <section class="page" id="page-calendar" role="tabpanel" aria-labelledby="tab-calendar" data-page="calendar"></section>
        <section class="page" id="page-settings" role="tabpanel" aria-labelledby="tab-settings" data-page="settings"></section>
      </main>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <div id="overlay-root"></div>
    <noscript><p class="boot">O Magno Space precisa de JavaScript para funcionar.</p></noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
